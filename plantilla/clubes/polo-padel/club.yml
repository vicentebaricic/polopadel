equipo_muestra: Nombres y bios de ejemplo
equipo:
  - nombre: Daniela
    cargo: Fundadora del club
    foto: assets/equipo/fundadora.jpg
    bio: "Levantó Polo Padel para que Piedra Roja tuviera su club: canchas de primer nivel y un lugar donde todos se conocen por su nombre."
  - nombre: Matías Rojas
    cargo: Head coach · Polo System
    foto: assets/equipo/head-coach.jpg
    bio: Diseñó el método del club. Si llegas por primera vez, él hace tu diagnóstico y arma tu plan.
  - nombre: Diego Araya
    cargo: Entrenador · Competición
    foto: assets/equipo/coach-competicion.jpg
    bio: Prepara a los equipos del club para ligas y torneos. Táctica, físico y cabeza fría en el tie-break.
  - nombre: Camila Fuentes
    cargo: Comunidad y eventos
    foto: assets/equipo/comunidad.jpg
    bio: Arma los partidos, los americanos y el tercer tiempo. Si te falta el cuarto, escríbele a ella.

resenas:
  nota: "4,8"
  cantidad: 96
  muestra: true
  lista:
    - nombre: Francisca V.
      detalle: Socia · hace 2 meses
      texto: Canchas impecables y muy buena onda. Llegué sin conocer a nadie y a las dos semanas ya tenía partido fijo los martes.
    - nombre: Rodrigo P.
      detalle: Socio · hace 1 mes
      texto: Lo mejor son los profes. Te explican qué estás haciendo mal y te lo corrigen de verdad. Subí de nivel en tres meses.
    - nombre: Cristóbal M.
      detalle: Jugador · hace 3 semanas
      texto: Súper cerca de la casa, fácil de reservar y los americanos del viernes son lo mejor de la semana.

banda:
  imagen: assets/fotos/cancha-palas.jpg
  alt: Palas y pelotas sobre una cancha de pádel azul

# Precios por persona en CLP según cuántos son en la clase
precios:
  grupos: [4, 3, 2]
  mensual: { 4: 59990, 3: 69990, 2: 89990 }
  anual:   { 4: 49990, 3: 57990, 2: 74990 }
  individual: 189990
  muestra: Precios de ejemplo · confirmar con el club

paleta:
  marca: "#154075"        # color principal (del logo)
  oscuro: "#0C2340"       # textos y fondos profundos
  acento: "#D7F24B"       # verde pelota: botones y destacados
  tono: "#C98B5A"         # madera: detalles sobre fondos oscuros
  tono_oscuro: "#A8673A"  # tierra: detalles sobre fondos claros
  crema: "#F5F1E8"
  fondo_claro: "#FBFAF6"

# ---------------------------------------------------------------- perillas de diseño
estilo:
  tipografia: deportiva     # deportiva | condensada | geometrica | limpia
  forma: redonda            # redonda | suave | recta
  hero: completo            # completo | dividido
  etiquetas: barra          # barra | numero | simple
  variante_textos: 1        # 1, 2 o 3 (elige entre las frases alternativas de textos.yml)
  secciones: [club, partners, metodo, garantia, equipo, resenas, banda, visita, cta]
  menu: [club, metodo, precios, visita]
  propuesta_inicial: marca  # marca (domina el color del club) | clara (domina el blanco)
  selector_propuestas: true # muestra el selector A/B para presentar al cliente
  nombres_propuestas: { marca: "A · Azul", clara: "B · Blanco" }

# Textos propios que reemplazan a los genéricos (opcional)
textos:
  garantia:
    sello: "GARANTÍA {metodo} · {club} CHICUREO ·"
    texto: "Entrena con nosotros <strong>{dias} días</strong>. Si cumples el plan y tu video comparativo no muestra que subiste de nivel, el 4º mes corre por nuestra cuenta."
